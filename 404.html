<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — ヒカワ ユウジロウ</title>
  <link rel="icon" type="image/svg+xml" href="/portfolio/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Shippori+Mincho:wght@500&family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse 80% 60% at 50% 20%, rgba(211, 162, 79, 0.07), transparent 60%), #0a0a0f;
      color: #ece7df;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 300;
      text-align: center;
      padding: 24px;
    }
    .num {
      font-family: "Cormorant Garamond", "Shippori Mincho", serif;
      font-size: clamp(5rem, 18vw, 9rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(211, 162, 79, 0.55);
    }
    h1 {
      font-family: "Shippori Mincho", "Cormorant Garamond", serif;
      font-size: 1.4rem;
      font-weight: 500;
      margin: 18px 0 8px;
    }
    p { color: #9a958c; font-size: 0.85rem; margin-bottom: 36px; }
    a {
      display: inline-block;
      padding: 13px 32px;
      border: 1px solid rgba(211, 162, 79, 0.35);
      color: #d3a24f;
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      transition: background 0.3s ease, color 0.3s ease;
    }
    a:hover { background: #d3a24f; color: #12100a; }
  </style>
</head>
<body>
  <main>
    <div class="num">404</div>
    <h1>ページが見つかりません</h1>
    <p>The page you are looking for does not exist.</p>
    <a href="/portfolio/">トップへ戻る · Back home</a>
  </main>
</body>
</html>
